name: Update views

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data.json, scripts/update.mjs]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find new uploads, fetch views, publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stats="$RUNNER_TEMP/stats.json"
          if git fetch -q --depth=1 origin data; then git show FETCH_HEAD:stats.json > "$stats"; else echo '{}' > "$stats"; fi

          for attempt in 1 2 3; do
            node scripts/update.mjs data.json "$stats"
            if git diff --quiet -- data.json; then break; fi
            git add data.json && git commit -qm "Add new uploads found on creators' channels"
            if git push -q origin HEAD:main; then break; fi
            echo "main moved; retrying with the latest data"
            git fetch -q origin main && git reset -q --hard origin/main
          done

          pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir "$pub"; cp "$stats" "$pub/"
          cd "$pub" && git init -q -b data && git add stats.json \
            && git -c user.name="stats-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update stats" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data
